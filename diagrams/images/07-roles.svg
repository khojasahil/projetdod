  <text font-family="Arial, sans-serif" font-size="19" font-weight="700" x="48" y="596" fill="#C76C12">Rattachés à l’action finale</text>
  <text font-family="Arial, sans-serif" font-size="20" font-weight="400" x="48" y="994" fill="#142B46">ref_id retrouve la fiche. type_code précise le niveau de renseignement attendu pour ce rôle.</text>

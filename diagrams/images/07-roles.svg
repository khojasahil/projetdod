  <text font-family="Arial, sans-serif" font-size="18" font-weight="400" x="1106" y="692" fill="#24364B">Camille effectue le dépôt pour la société A : Camille</text>
  <text font-family="Arial, sans-serif" font-size="18" font-weight="400" x="1106" y="717" fill="#24364B">est l’exécutante; A est le tiers représenté. La source</text>
  <text font-family="Arial, sans-serif" font-size="18" font-weight="400" x="1106" y="742" fill="#24364B">des fonds est une information distincte.</text>

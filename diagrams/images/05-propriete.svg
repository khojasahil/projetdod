  <text font-family="Arial, sans-serif" font-size="21" font-weight="700" x="1222" y="587" fill="#142B46">Leur point commun</text>
  <text font-family="Arial, sans-serif" font-size="18" font-weight="400" x="1222" y="620" fill="#24364B">Chaque ligne appartient à une seule</text>
  <text font-family="Arial, sans-serif" font-size="18" font-weight="400" x="1222" y="645" fill="#24364B">ENTITY. Les noms ne sont pas des</text>
  <text font-family="Arial, sans-serif" font-size="18" font-weight="400" x="1222" y="670" fill="#24364B">références vers DEFINITION dans ces</text>
  <text font-family="Arial, sans-serif" font-size="18" font-weight="400" x="1222" y="695" fill="#24364B">listes.</text>
  <rect stroke-width="1" x="48" y="888" width="1504" height="150" rx="12" fill="#EAF0F7" stroke="#EAF0F7" />
  <text font-family="Arial, sans-serif" font-size="21" font-weight="700" x="70" y="927" fill="#142B46">Ne pas confondre les bénéficiaires</text>
  <text font-family="Arial, sans-serif" font-size="18" font-weight="400" x="70" y="960" fill="#24364B">TRUST_BENEFICIARY décrit une personne bénéficiaire d’une fiducie. BENEFICIARY, dans le domaine Rôles, décrit le bénéficiaire d’une opération.</text>
</svg>

  <text font-family="Arial, sans-serif" font-size="21" font-weight="700" x="70" y="659" fill="#142B46">Une correction ne remplace pas le passé</text>
  <text font-family="Arial, sans-serif" font-size="18" font-weight="400" x="70" y="692" fill="#24364B">Une ligne de STR_REPORT représente une version. La</text>
  <text font-family="Arial, sans-serif" font-size="18" font-weight="400" x="70" y="717" fill="#24364B">version 2 garde le même report_group_id et pointe vers la</text>
  <text font-family="Arial, sans-serif" font-size="18" font-weight="400" x="70" y="742" fill="#24364B">version 1.</text>
  <rect stroke-width="1" x="48" y="844" width="540" height="180" rx="12" fill="#EAF0F7" stroke="#EAF0F7" />
  <text font-family="Arial, sans-serif" font-size="21" font-weight="700" x="70" y="883" fill="#142B46">À dire en réunion</text>
  <text font-family="Arial, sans-serif" font-size="18" font-weight="400" x="70" y="916" fill="#24364B">« Le rapport rassemble les faits et les raisons du soupçon.</text>
  <text font-family="Arial, sans-serif" font-size="18" font-weight="400" x="70" y="941" fill="#24364B">Les autres domaines viennent préciser ce récit. »</text>
